name: Deploy with SPA support

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Add SPA support files
        run: |
          # Добавляем .nojekyll
          touch ./build/.nojekyll
          
          # Копируем index.html как 404.html для SPA
          cp ./build/index.html ./build/404.html
          
          # Создаем _redirects для Netlify-style routing (если нужно)
          echo "/*    /index.html   200" > ./build/_redirects
          
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages  